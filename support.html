<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprutix Support</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img
        src="images/logo.png"
        alt="Sprutix Logo"
        class="logo-img"
        style="width: 90px; height: auto; margin: 1.2rem"
      />
    </header>
    <main>
      <section class="support-container">
        <h1>Contact Support</h1>
        <p>If you need help with the app, fill out the form below and we'll get back to you.</p>
        <form
          id="support-form"
          class="support-form"
          novalidate
          action="mailto:sprutixfeedback@gmail.com"
          method="post"
          enctype="text/plain"
        >
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />

          <label for="email">Contact Email *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />

          <label for="account">Account Number (optional)</label>
          <input type="text" id="account" name="account" placeholder="Account number (if available)" />

          <label for="message">Message *</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Describe your issue or question"
            required
          ></textarea>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Send Message</button>
            <button type="reset" class="btn-secondary">Reset</button>
          </div>

          <div id="form-status" class="form-status" aria-live="polite"></div>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 Sprutix. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
